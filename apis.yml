aid: agent-diff
name: Agent Diff
description: >-
  Agent Diff creates isolated, ephemeral replicas of third-party APIs (Slack, Linear, GitHub). Agents interact with
  these sandboxes to produce deterministic state-change diffs without side effects, rate limits, or real API calls.
  Ideal for testing AI agents that interact with external APIs.
