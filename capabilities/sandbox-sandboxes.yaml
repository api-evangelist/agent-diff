    resources:
    - name: sandboxes
      path: /sandboxes
      operations:
      - name: createsandbox
        method: POST
        description: Agent Diff Create Sandbox
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: listsandboxes
        method: GET
        description: Agent Diff List Sandboxes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: status
          in: query
          type: string
          description: Filter by sandbox status.
        - name: api
          in: query
          type: string
          description: Filter by sandboxed API (e.g., slack, linear).
        - name: limit
          in: query
          type: integer
          description: Maximum number of results.
        - name: offset
          in: query
          type: integer
          description: Pagination offset.
    - name: sandboxes-sandboxId
      path: /sandboxes/{sandboxId}
      operations:
      - name: getsandbox
        method: GET
        description: Agent Diff Get Sandbox
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sandboxId
          in: path
          type: string
          description: Sandbox identifier.
          required: true
      - name: deletesandbox
        method: DELETE
        description: Agent Diff Delete Sandbox
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sandboxId
          in: path
          type: string
          description: Sandbox identifier.
          required: true
    authentication:
      type: bearer
      token: '{{env.AGENT_DIFF_API_KEY}}'
  exposes:
  - type: rest
    namespace: sandbox-sandboxes-rest
    port: 8080
    description: REST adapter for Agent Diff Sandbox API — Sandboxes. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/sandboxes
      name: sandboxes
      description: REST surface for sandboxes.
      operations:
      - method: POST
        name: createsandbox
        description: Agent Diff Create Sandbox
        call: sandbox-sandboxes.createsandbox
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
