name: Agent Diff Sandbox API
namespace: agent-diff-sandbox-api
description: "Shared capability definitions for the Agent Diff Sandbox API."
tools:
  - name: create-sandbox
    description: "Create an isolated sandbox replica of a third-party API for agent testing."
    operation: POST /sandboxes
    parameters:
      - name: api
        description: "Third-party API to sandbox (slack, linear, github)."
        required: true
      - name: scenario
        description: "Named scenario for seed data."
      - name: seed_data
        description: "Initial state data to populate the sandbox."
      - name: ttl
        description: "Time-to-live in seconds."
  - name: list-sandboxes
    description: "List all active sandboxes for the account."
    operation: GET /sandboxes
    parameters:
      - name: status
        description: "Filter by status (ready, active, expired)."
      - name: api
        description: "Filter by sandboxed API."
  - name: get-sandbox
    description: "Retrieve details of a specific sandbox."
    operation: GET /sandboxes/{sandboxId}
    parameters:
      - name: sandboxId
        description: "Sandbox identifier."
        required: true
  - name: delete-sandbox
    description: "Terminate and delete a sandbox."
    operation: DELETE /sandboxes/{sandboxId}
    parameters:
      - name: sandboxId
        description: "Sandbox identifier."
        required: true
  - name: list-sandbox-diffs
    description: "List state-change diffs produced by agent interactions with a sandbox."
    operation: GET /sandboxes/{sandboxId}/diffs
    parameters:
      - name: sandboxId
        description: "Sandbox identifier."
        required: true
      - name: limit
        description: "Maximum results."
      - name: offset
        description: "Pagination offset."
