name: API Agent Testing
description: "End-to-end workflow for testing AI agents against isolated ephemeral API sandbox replicas."
apisComposed:
  - agent-diff-sandbox-api
tools:
  - name: provision-test-sandbox
    description: "Create an isolated sandbox replica of a target API (Slack, Linear) with specific scenario seed data for deterministic agent testing."
    sharedTool: agent-diff-sandbox-api/create-sandbox
  - name: inspect-sandbox-state
    description: "Check the current status and configuration of an active sandbox."
    sharedTool: agent-diff-sandbox-api/get-sandbox
  - name: review-agent-diffs
    description: "Review all state-change diffs produced by agent operations in the sandbox to verify agent behavior."
    sharedTool: agent-diff-sandbox-api/list-sandbox-diffs
  - name: cleanup-sandbox
    description: "Terminate and remove the sandbox after testing to free resources."
    sharedTool: agent-diff-sandbox-api/delete-sandbox
personas:
  - ai-agent-developer
  - devops-engineer
