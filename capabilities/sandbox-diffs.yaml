naftiko: 1.0.0-alpha2
info:
  label: Agent Diff Sandbox API — Diffs
  description: 'Agent Diff Sandbox API — Diffs. 1 operations. Lead operation: Agent Diff List Sandbox Diffs. Self-contained
    Naftiko capability covering one Agent Diff business surface.'
  tags:
  - Agent Diff
  - Diffs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    AGENT_DIFF_API_KEY: AGENT_DIFF_API_KEY
capability:
  consumes:
  - type: http
    namespace: sandbox-diffs
    baseUri: https://api.agentdiff.dev/v1
    description: Agent Diff Sandbox API — Diffs business capability. Self-contained, no shared references.
    resources:
    - name: sandboxes-sandboxId-diffs
      path: /sandboxes/{sandboxId}/diffs
      operations:
      - name: listsandboxdiffs
        method: GET
        description: Agent Diff List Sandbox Diffs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: sandboxId
          in: path
          type: string
          description: Sandbox identifier.
          required: true
        - name: limit
          in: query
          type: integer
          description: Maximum number of diffs.
        - name: offset
          in: query
          type: integer
          description: Pagination offset.
    authentication:
      type: bearer
      token: '{{env.AGENT_DIFF_API_KEY}}'
  exposes:
  - type: rest
    namespace: sandbox-diffs-rest
    port: 8080
    description: REST adapter for Agent Diff Sandbox API — Diffs. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/sandboxes/{sandboxid}/diffs
      name: sandboxes-sandboxid-diffs
      description: REST surface for sandboxes-sandboxId-diffs.
      operations:
      - method: GET
        name: listsandboxdiffs
        description: Agent Diff List Sandbox Diffs
        call: sandbox-diffs.listsandboxdiffs
        with:
          sandboxId: rest.sandboxId
          limit: rest.limit
          offset: rest.offset
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: sandbox-diffs-mcp
    port: 9090
    transport: http
    description: MCP adapter for Agent Diff Sandbox API — Diffs. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: agent-diff-list-sandbox-diffs
      description: Agent Diff List Sandbox Diffs
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: sandbox-diffs.listsandboxdiffs
      with:
        sandboxId: tools.sandboxId
        limit: tools.limit
        offset: tools.offset
      outputParameters:
      - type: object
        mapping: $.
